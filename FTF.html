<!DOCTYPE html>
<html>
    <head>
        <title>Fears to Fathom Games</title>
        <link rel="icon" href="img/Logo Lorenzo/Gorilmoncat.png" type="image/png">
        <style>
            * {
                font-family: arial;
            }
            body {
                margin: 0;
                padding: 20px; /* espacio arriba */
                text-align: center; /* centra el contenido horizontal */
            }
            .logos {
                display: flex;
                justify-content: center; /* centra las imágenes */
                gap: 10px;
                margin-bottom: 15px;
            }
            
            /* --- ESTILO DE BOTONES MEJORADO --- */
            .wbfs, .wup {
                display: inline-block;      /* Permite centrado y dimensiones de botón */
                min-width: 64px;
                border: none;
                margin: 6px 2px;
                height: 36px;
                line-height: 36px;          /* Centra el texto verticalmente */
                border-radius: 4px;
                font-family: "Google Sans", Roboto, Arial, sans-serif;
                font-size: 15px;
                font-weight: 500;
                padding: 0 24px;
                box-sizing: border-box;
                background-color: rgb(26, 115, 232);
                color: #fff;
                cursor: pointer;
                text-decoration: none;      /* Elimina el subrayado azul */
                vertical-align: middle;
                outline: none;              /* Elimina el recuadro al hacer clic */
                user-select: none;          /* Evita la selección azul del texto */
                transition: background-color 0.2s;
            }

            .wbfs:hover, .wup:hover {
                background-color: rgb(20, 90, 190); /* Efecto al pasar el mouse */
            }

            .buttons {
                margin-top: 15px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="logos">
            <img src="img/Logo Lorenzo/Gorilmoncat + logo gameoverdeluxe2.png" width="50" alt="logo">
            <img src="img/Logo Lorenzo/Gameoverdeluxe2 logo blanco y rojo.png" width="150" alt="logo">
        </div>

          <a class="wbfs" href='https://www.mediafire.com/file/4aatjtyhgsqkdkr/Fears_to_Fathom_-_Carson_House_Setup.zip/file'>Fears to Fathom - Carson House</a>
