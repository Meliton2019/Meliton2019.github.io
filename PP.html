<!DOCTYPE html>
<html>
    <head>
        <title>Poppy Playtime</title>
        <link rel="icon" href="img/Logo Lorenzo/Gorilmoncat.png" type="image/png">
        <style>
            * {
                font-family: arial;
            }
            body {
                margin: 0;
                padding: 20px; /* espacio arriba */
                text-align: center; /* centra el contenido horizontal */
            }
            .logos {
                display: flex;
                justify-content: center; /* centra las imágenes */
                gap: 10px;
                margin-bottom: 15px;
            }
            .wbfs, .wup {
                display: inline-block;      /* Permite centrado y dimensiones de botón */
                min-width: 64px;
                border: none;
                margin: 6px 2px;
                height: 36px;
                line-height: 36px;          /* Centra el texto verticalmente */
                border-radius: 4px;
                font-family: "Google Sans", Roboto, Arial, sans-serif;
                font-size: 15px;
                font-weight: 500;
                padding: 0 24px;
                box-sizing: border-box;
                background-color: rgb(26, 115, 232);
                color: #fff;
                cursor: pointer;
                text-decoration: none;      /* Elimina el subrayado azul */
                vertical-align: middle;
                outline: none;              /* Elimina el recuadro al hacer clic */
                user-select: none;          /* Evita la selección azul del texto */
                transition: background-color 0.2s;
            }
            .part {
                        display: inline-block;      /* Permite centrado y dimensiones de botón */
                        min-width: 64px;
                        border: none;
                        margin: 6px 2px;
                        height: 36px;
                        line-height: 36px;          /* Centra el texto verticalmente */
                        border-radius: 4px;
                        font-family: "Google Sans", Roboto, Arial, sans-serif;
                        font-size: 15px;
                        font-weight: 500;
                        padding: 0 24px;
                        box-sizing: border-box;
                        background-color: rgb(255, 192, 0);
                        color: #fff;
                        cursor: pointer;
                        text-decoration: none;      /* Elimina el subrayado azul */
                        vertical-align: middle;
                        outline: none;              /* Elimina el recuadro al hacer clic */
                        user-select: none;
            }
            .buttons {
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <div class="logos">
            <img src="img/Logo Lorenzo/Gorilmoncat + logo gameoverdeluxe2.png" width="50"alt="logo">
            <img src="img/Logo Lorenzo/Gameoverdeluxe2 logo blanco y rojo.png" width="150"alt="logo">
        </div>
        <h1>Poppy Playtime</h1>

          <a class="wbfs" type="a" href='https://www.mediafire.com/file/mqiaikwp4y3a0di/Poppy_Playtime_Setup.zip/file'>Poppy Playtime</a>

          <a class="part" type="a" href='PP5.html'>Poppy Playtime Chapter 5</a>

</html>
